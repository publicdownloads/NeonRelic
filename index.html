<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonRelic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <main class="hero">
        <h1 class="logo">NEON<span>RELIC</span></h1>

        </p>

            <div class="card">

                <p>FPS / Platformer</p>
            </div>

            <div class="card">
                <h3>Version</h3>
                <p>v0.01</p>
            </div>

            <div class="card">
                <h3>Platform</h3>
                <p>Windows</p>
            </div>
        </div>
    </main>

</html>
